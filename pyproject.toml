[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kerf-ai-evals"
version = "0.2.0"
description = "Evidence-first evaluation infrastructure for AI agents that query business data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jacob" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx[socks]>=0.28,<1.0",
  "openai>=1.75,<3.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[project.scripts]
kerf = "kerf.cli:main"

[tool.setuptools.packages.find]
include = ["kerf*"]

[tool.setuptools.package-data]
kerf = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
